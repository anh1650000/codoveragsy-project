services:
  postgres:
    image: postgres:16
    container_name: contract-audit-postgres
    environment:
      POSTGRES_DB: contracts
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: contracts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracts -d contracts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
